name: Deploy public installer to GitHub Pages

on:
  push:
    branches:
      - codex/plugin-download-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v7
      - name: Upload static installer
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true

  deploy:
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The stock deploy action cancels valid Pages deployments after ten minutes.
      # Keep the OIDC-bound commit version and leave slow server-side work intact.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v9
        env:
          PAGES_DEPLOY_TIMEOUT_MS: "1200000"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifactName = "github-pages";
            const buildVersion = context.sha;
            const timeoutMs = Number(process.env.PAGES_DEPLOY_TIMEOUT_MS);
            const pollIntervalMs = 5000;
            const terminalFailures = new Set([
              "deployment_failed",
              "deployment_content_failed",
              "deployment_cancelled",
              "deployment_lost",
            ]);

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner,
                repo,
                run_id: context.runId,
                name: artifactName,
                per_page: 100,
              },
            );
            const matches = artifacts.filter(
              (artifact) => artifact.name === artifactName && !artifact.expired,
            );
            if (matches.length !== 1) {
              throw new Error(
                `Expected one active ${artifactName} artifact; found ${matches.length}.`,
              );
            }

            const idToken = await core.getIDToken();
            const { data: deployment } = await github.request(
              "POST /repos/{owner}/{repo}/pages/deployments",
              {
                owner,
                repo,
                artifact_id: matches[0].id,
                pages_build_version: buildVersion,
                oidc_token: idToken,
              },
            );
            const deploymentId =
              deployment.id ??
              deployment.status_url?.split("/").pop() ??
              buildVersion;

            core.setOutput("page_url", deployment.page_url ?? "");
            core.info(`Created Pages deployment ${deploymentId}.`);

            const deadline = Date.now() + timeoutMs;
            let lastStatus = "unknown_status";
            while (Date.now() < deadline) {
              await new Promise((resolve) => setTimeout(resolve, pollIntervalMs));
              const { data: status } = await github.request(
                "GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}",
                {
                  owner,
                  repo,
                  pages_deployment_id: deploymentId,
                },
              );
              lastStatus = status.status;
              core.info(`Current status: ${lastStatus}`);

              if (lastStatus === "succeed") {
                core.setOutput("status", lastStatus);
                return;
              }
              if (terminalFailures.has(lastStatus)) {
                throw new Error(`Pages deployment ended with ${lastStatus}.`);
              }
            }

            throw new Error(
              `Pages deployment remained ${lastStatus} for ${timeoutMs}ms. ` +
                "It was left running instead of being canceled.",
            );
